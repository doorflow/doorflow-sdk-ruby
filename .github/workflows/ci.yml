name: Ruby SDK CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [sdk-regenerated]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ['3.2', '3.3', '3.4']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby ${{ matrix.ruby-version }}
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true
    
    - name: Install dependencies
      run: bundle install

    - name: Run tests with coverage
      run: bundle exec rspec
      env:
        COVERAGE: true

    - name: Upload coverage to Codecov
      if: matrix.ruby-version == '3.4'
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage/coverage.xml
        flags: unittests
        name: codecov-umbrella

    - name: Run StandardRB
      run: bundle exec standardrb || echo "StandardRB not configured"
      continue-on-error: true

    - name: Security audit
      run: |
        gem install bundler-audit
        bundle audit check --update
      continue-on-error: true

    - name: Check gem build
      run: gem build doorflow-api.gemspec

  auto-publish:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'repository_dispatch'
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4'
        bundler-cache: true

    - name: Update version
      if: github.event.client_payload.version
      run: |
        version=${{ github.event.client_payload.version }}
        sed -i "s/VERSION = '[^']*'/VERSION = '$version'/" lib/doorflow-api/version.rb
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add lib/doorflow-api/version.rb
        git commit -m "Bump version to $version"
        git tag "v$version"
        git push origin main
        git push origin "v$version"