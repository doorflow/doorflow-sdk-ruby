name: Generate SDK from OpenAPI Spec

on:
  repository_dispatch:
    types: [spec-updated]
  workflow_dispatch:
    inputs:
      spec_ref:
        description: 'doorguard branch, tag, or commit SHA to fetch openapi.yaml from'
        required: false
        default: 'master'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch OpenAPI spec from doorguard
        uses: actions/checkout@v4
        with:
          repository: netnodes/doorguard
          ref: ${{ github.event.client_payload.commit_sha || inputs.spec_ref || 'master' }}
          token: ${{ secrets.DOORGUARD_READ_TOKEN }}
          path: .doorguard
          sparse-checkout: openapi.yaml
          sparse-checkout-cone-mode: false

      - name: Stage OpenAPI spec
        run: |
          cp .doorguard/openapi.yaml openapi.yaml
          rm -rf .doorguard
          if [ ! -s openapi.yaml ]; then
            echo "Error: openapi.yaml not present after checkout"
            exit 1
          fi
          echo "✅ OpenAPI spec staged from netnodes/doorguard"

      - name: Read current version
        id: version
        run: |
          if [ -f VERSION ]; then
            VERSION=$(cat VERSION)
          else
            VERSION="1.0.0"
          fi
          echo "current=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Generate Ruby SDK
        run: |
          docker run --rm \
            -v ${PWD}:/local \
            openapitools/openapi-generator-cli:latest generate \
            -i /local/openapi.yaml \
            -g ruby \
            -o /local \
            -c /local/.openapi-generator-config.yaml \
            --additional-properties=gemVersion=${{ steps.version.outputs.current }}

          # Set permissions on generated files
          sudo chown -R $(id -u):$(id -g) .

          echo "✅ SDK generated successfully"

      - name: Run post-generation enhancements
        run: |
          if [ -f bin/post-generate ]; then
            ruby bin/post-generate
          else
            echo "⚠️  No post-generate script found, skipping"
          fi

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Run tests
        run: |
          bundle install
          bundle exec rspec
        continue-on-error: true
        id: tests

      - name: Check for changes
        id: changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if there are any changes
          if [ -z "$(git status --porcelain)" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected:"
            git status --short
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            chore: Update SDK from doorguard OpenAPI spec

            Generated from doorguard@${{ github.event.client_payload.commit_sha || 'master' }}

            ${{ github.event.client_payload.commit_message || 'Manual update' }}
          branch: auto-update/spec-${{ github.event.client_payload.commit_sha || github.run_id }}
          delete-branch: true
          title: "Update SDK from latest OpenAPI spec"
          body: |
            ## 🤖 Auto-generated SDK Update

            This PR was automatically generated in response to OpenAPI spec changes in doorguard.

            ### Source Information
            - **Commit SHA**: `${{ github.event.client_payload.commit_sha || 'unknown' }}`
            - **Source ref**: ${{ github.event.client_payload.commit_sha || inputs.spec_ref || 'master' }}
            - **Triggered by**: ${{ github.event.client_payload.pusher_name || github.actor }}

            ### Changes in doorguard
            ```
            ${{ github.event.client_payload.commit_message || 'Manual update' }}
            ```

            ### Review Checklist
            - [ ] Generated code compiles and runs
            - [ ] Tests pass (check CI)
            - [ ] No breaking changes (or documented if present)
            - [ ] Documentation updated
            - [ ] Version bump appropriate:
              - [ ] Major (breaking changes)
              - [ ] Minor (new features)
              - [ ] Patch (bug fixes)

            ### Test Results
            ${{ steps.tests.outcome == 'success' && '✅ Tests passed' || '⚠️ Tests failed - review required' }}

            ---

            Generated by [doorguard SDK notification workflow](https://github.com/netnodes/doorguard/blob/master/.github/workflows/notify-sdk-repos.yml)
          labels: |
            auto-generated
            dependencies
            sdk-update

      - name: Log summary
        if: always()
        run: |
          echo "### SDK Generation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.version.outputs.current }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Changes**: ${{ steps.changes.outputs.has_changes }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests**: ${{ steps.tests.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Source ref**: ${{ github.event.client_payload.commit_sha || inputs.spec_ref || 'master' }}" >> $GITHUB_STEP_SUMMARY
